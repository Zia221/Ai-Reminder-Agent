[project]
name = "ai-reminder-agent-backend"
version = "0.1.0"
description = "Backend API for AI Reminder Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.8,<3.0",
    "email-validator>=2.0,<3.0",
    "openai>=3.36.1",
    "reportlab>=5.1.0",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
